aid: gt-medical-technologies
name: GT Medical Technologies
description: >-
  GT Medical Technologies, Inc. is a Tempe, Arizona medical device company founded by brain
  tumor specialists to commercialize GammaTile, an FDA-cleared, bioabsorbable collagen implant
  embedded with Cesium-131 radiation seeds. Surgeons place the tiles directly into the resection
  cavity at the time of brain tumor removal, delivering immediate, targeted radiation without the
  weeks-long healing delay conventional external beam radiotherapy requires. The company sells a
  physical, prescription-only implant to hospitals and neurosurgical centers through a direct
  sales force and a Salesforce-based ordering portal; it publishes no public API, SDK, developer
  portal, or machine-readable specification of any kind.
