    during brain surgery, and its entire web estate is a 44-page Next.js marketing and clinical site
    for patients and neurosurgeons; the only application it runs is a Salesforce Experience Cloud
    ordering portal at orders.gammatile.com whose stock platform OIDC discovery document is the sole
    machine-readable file anywhere on a company-controlled host, while every OpenAPI, GraphQL, MCP,
    agent-card and llms.txt path on gammatile.com returns a hard 404 and the legacy gtmedtech.com
    domain answers HTTP 200 with an identical 104899-byte copy of the homepage for every path
    including a nonsense control, making it a soft-404 catch-all rather than a developer surface.
